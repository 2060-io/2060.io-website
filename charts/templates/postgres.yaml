{{- if .Values.dataroom.enabled }}
# In-cluster Postgres for the data room. Single replica; data on a PVC via
# volumeClaimTemplates (kept across upgrades; deleting the StatefulSet does
# not delete the claim). The password comes from the app Secret
# (POSTGRES_PASSWORD), which the deploy workflows create with
# helm.sh/resource-policy=keep.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "website.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "website.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "website.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "website.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "website.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "website.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.dataroom.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dataroom
            - name: POSTGRES_DB
              value: dataroom
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relaticle.secretName }}
                  key: POSTGRES_PASSWORD
            # Subdirectory so the PVC's lost+found doesn't trip initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dataroom"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dataroom"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.dataroom.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.dataroom.postgres.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.dataroom.postgres.storage }}
{{- end }}
