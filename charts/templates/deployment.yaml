apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "website.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.dataroom.enabled }}
  # The data-room storage PVC is ReadWriteOnce: a rolling update would leave
  # the new pod stuck Pending on the volume, so replace the pod instead
  # (brief downtime per deploy).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "website.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "website.selectorLabels" . | nindent 8 }}
      annotations:
        # Forces a pod rollout on every `helm upgrade`, even when the image
        # tag is unchanged. Paired with image.pullPolicy=Always in values.yaml
        # so the replacement pod always repulls the image from the registry.
        # See: https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: website
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            # Ops alert webhook (Discord-shaped); alertOps() no-ops when unset.
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.relaticle.secretName }}
                  key: ALERT_WEBHOOK_URL
                  optional: true
            {{- if .Values.dataroom.enabled }}
            # ── Data room (invitation-only auth, NDA, documents) ──
            - name: AUTH_URL
              value: {{ .Values.dataroom.authUrl | quote }}
            - name: NDA_FILENAME
              value: {{ .Values.dataroom.ndaFilename | quote }}
            - name: STORAGE_DIR
              value: /data
            {{- with .Values.dataroom.emailLogoUrl }}
            - name: EMAIL_LOGO_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dataroom.emailVeranaLogoUrl }}
            - name: EMAIL_VERANA_LOGO_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.dataroom.enabled }}
          envFrom:
            # DATABASE_URL, AUTH_SECRET, AUTH_GOOGLE_*/AUTH_GITHUB_*, MAIL_*,
            # ADMIN_BOOTSTRAP_EMAILS — mirrored 1:1 from GitHub Actions secrets
            # by the deploy workflows. Optional so the pod still starts before
            # the secret exists (the data room then just refuses sign-ins).
            - secretRef:
                name: {{ .Values.relaticle.secretName }}
                optional: true
          volumeMounts:
            - name: storage
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- if .Values.dataroom.enabled }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "website.fullname" . }}-storage
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
