# Default values for the 2060.io website Helm chart.

nameOverride: "website"
fullnameOverride: ""

image:
  repository: io2060/website
  # tag defaults to "v<Chart.AppVersion>" when empty, matching the Docker
  # tags produced by .github/workflows/cd.yml (e.g. v1.0.0).
  tag: ""
  # Always repull on pod creation so a redeploy against a mutable tag
  # (dev, latest, v1) still picks up the newest image.
  pullPolicy: Always

# Marketing site; a single replica is plenty for the traffic we see and
# lets the rolling-update strategy swap in the new pod cleanly on every
# `helm upgrade`.
replicaCount: 1

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 80
  # The Next.js standalone server listens on 3000.
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: 2060.io
  tls:
    enabled: true
    secretName: website-2060-io-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

# Container env for the Node.js runtime.
env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: HOSTNAME
    value: 0.0.0.0

# Health probes hit the Next.js app root, which is statically prerendered and
# always returns 200 once the standalone server is listening.
probes:
  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Relaticle CRM integration for the /contact form. The token is injected into
# the `secretName` Secret by the deploy workflows from the RELATICLE_API_TOKEN
# GitHub Actions secret (kubectl create secret, kept across helm upgrades).
relaticle:
  enabled: true
  # In-cluster Relaticle service (same OVH cluster, namespace `relaticle`).
  apiUrl: http://relaticle.relaticle.svc.cluster.local
  secretName: 2060-website-secrets

# ─── Investor data room (invitation-only; /login, /dataroom, /vc-admin,
# /admin). Adds Postgres, a storage volume, and migrate/seed hook Jobs. All
# credentials live in the `relaticle.secretName` Secret, which the deploy
# workflows populate 1:1 from GitHub Actions secrets (DATABASE_URL is derived
# there from POSTGRES_PASSWORD).
dataroom:
  enabled: true
  # Public origin for Auth.js (OAuth callbacks, links in emails).
  authUrl: https://2060.io
  # Which legal/ file the seed activates as the NDA.
  ndaFilename: nda-v1.md
  # Optional hosted raster logos for email headers (empty → text wordmarks).
  emailLogoUrl: ""
  emailVeranaLogoUrl: ""

  # Migrator image (Dockerfile `migrator` stage): Prisma CLI + schema +
  # legal/, pushed by CI as migrate-<app tag> alongside every app tag. Runs
  # `migrate deploy` then the seed as post-install/pre-upgrade Helm hooks.
  migrate:
    tag: migrate-latest

  # In-cluster Postgres (StatefulSet + PVC). User/db are fixed to `dataroom`;
  # the password comes from the POSTGRES_PASSWORD key of the app Secret.
  postgres:
    image: postgres:16-alpine
    storage: 5Gi
    # Empty → the cluster's default StorageClass.
    storageClassName: ""
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  # Volume for data-room binaries (signed NDA PDFs, the document repository),
  # mounted at /data (STORAGE_DIR). ReadWriteOnce — the app deployment
  # therefore switches to the Recreate strategy while the data room is enabled.
  storage:
    size: 10Gi
    storageClassName: ""

# The runtime image runs as uid 1001 (nextjs); fsGroup makes the data-room
# storage PVC group-writable for it.
podSecurityContext:
  fsGroup: 1001
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
