name: Deploy to Kubernetes

# Manual-only rollout for pinning an arbitrary image tag to the cluster
# (rollback, redeploy `latest`/`dev`/`v1` floating tags, pin to a
# specific vX.Y.Z). Automatic deploys for new stable releases are
# chained off the `docker` job in cd.yml — we can't use a `release:
# published` trigger here because release-please creates the release
# with the default GITHUB_TOKEN, and events produced by GITHUB_TOKEN
# don't cascade into other workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. 2060-io-website-v2.3.0, v2, dev, latest)"
        required: true
        default: latest

concurrency:
  group: cd-deploy-k8s
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute image tag
        id: tag
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine image tag to deploy."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying io2060/website:$VERSION"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_2060_PROD }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::The KUBECONFIG_2060_PROD GitHub Actions secret is empty."
            echo "Set it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Wait for Docker images to be available on Docker Hub
        run: |
          for IMAGE in "io2060/website:${{ steps.tag.outputs.version }}" \
                       "io2060/website:migrate-${{ steps.tag.outputs.version }}"; do
            ok=""
            for i in $(seq 1 10); do
              if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
                echo "Image $IMAGE is available."
                ok=1
                break
              fi
              echo "[$i/10] Image $IMAGE not yet available on Docker Hub, waiting 30s..."
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "::error::Image $IMAGE was not available after ~5 minutes."
              exit 1
            fi
          done

      - name: Create/refresh app secret
        # Contact-form token + all data-room credentials, mirrored 1:1 from
        # GitHub Actions secrets by the shared script (kept in ci/ so this
        # workflow and cd.yml cannot drift). kubectl-managed (not helm),
        # annotated keep so helm never prunes it.
        env:
          RELATICLE_API_TOKEN: ${{ secrets.RELATICLE_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.ADMIN_BOOTSTRAP_EMAILS }}
        run: sh ci/create-app-secret.sh

      - name: Helm upgrade
        run: |
          helm upgrade --install website ./charts \
            --namespace web \
            --create-namespace \
            --set image.tag=${{ steps.tag.outputs.version }} \
            --set dataroom.migrate.tag=migrate-${{ steps.tag.outputs.version }} \
            --wait --timeout 5m

      - name: Show deployed resources
        if: always()
        run: |
          helm status website -n web || true
          kubectl -n web get deploy,svc,ingress -l app.kubernetes.io/name=website -o wide || true
