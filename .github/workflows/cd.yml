name: Continuous Deployment

on:
  push:
    branches: [main, 'release/**']

permissions:
  contents: write    # required for release-please and gh release create
  issues: write
  pull-requests: write

env:
  IMAGE_NAME: 'website'
  DOCKER_HUB_NAMESPACE: 'io2060'

jobs:
  resolve-version:
    uses: 2060-io/organization/.github/workflows/resolve-version-call.yml@d199fdc55832f78f90158117a93d227709ca2746 # main

  docker:
    needs: resolve-version
    if: needs.resolve-version.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest

    env:
      RELEASE_TYPE: ${{ needs.resolve-version.outputs.release-type }}
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.release-version }}
      RELEASE_MAJOR: ${{ needs.resolve-version.outputs.release-major }}
      RELEASE_MINOR: ${{ needs.resolve-version.outputs.release-minor }}
      RELEASE_PATCH: ${{ needs.resolve-version.outputs.release-patch }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute tags
        id: compute-tags
        run: |
          if [ "$RELEASE_TYPE" = "stable" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "SUFFIX=" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "SUFFIX=-dev" >> $GITHUB_ENV
            # semantic-release emits a pre-release patch like "1-dev.abc1234".
            # Take its first char so the v<M>.<m>.<p>-dev tag stays a simple integer.
            echo "RELEASE_PATCH_SHORT=${RELEASE_PATCH:0:1}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build & push ${{ env.IMAGE_NAME }} dev tags
        if: env.RELEASE_TYPE == 'dev'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:v${{ env.RELEASE_MAJOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}.${{ env.RELEASE_PATCH_SHORT }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

      # Migrator image (Dockerfile `migrator` stage): Prisma CLI + schema +
      # legal/, used by the chart's migrate/seed hook Jobs. Every app tag T
      # gets a matching migrate-T, so any deployable version can migrate.
      - name: Build & push ${{ env.IMAGE_NAME }} dev migrate tags
        if: env.RELEASE_TYPE == 'dev'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-v${{ env.RELEASE_MAJOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}.${{ env.RELEASE_PATCH_SHORT }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-${{ env.RELEASE_VERSION }}

      - name: Build & push ${{ env.IMAGE_NAME }} stable release tags
        if: env.RELEASE_TYPE == 'stable'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:v${{ env.RELEASE_MAJOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

      - name: Build & push ${{ env.IMAGE_NAME }} stable migrate tags
        if: env.RELEASE_TYPE == 'stable'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-v${{ env.RELEASE_MAJOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-v${{ env.RELEASE_MAJOR }}.${{ env.RELEASE_MINOR }}${{ env.SUFFIX }}
            ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:migrate-${{ env.RELEASE_VERSION }}

  # Roll the freshly-pushed image out to the OVH cluster. Chained here
  # rather than triggered by a `release: published` event because events
  # created via the default GITHUB_TOKEN do not cascade into other
  # workflows, so a `release:` trigger on release-please releases would
  # silently never fire. See:
  # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
  deploy:
    needs: [resolve-version, docker]
    # Auto-deploy stable releases only. Dev pushes on `main` rebuild the
    # `dev` image tag every time, but we don't want every merge to main
    # to roll the production namespace — the manual 'Deploy to Kubernetes'
    # workflow is still available to pin any tag (dev, latest, vX.Y.Z).
    if: needs.resolve-version.outputs.release-type == 'stable'
    runs-on: ubuntu-latest

    # Serialise deploys so two releases landing back-to-back can't race.
    concurrency:
      group: cd-deploy-k8s
      cancel-in-progress: false

    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.release-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_2060_PROD }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::The KUBECONFIG_2060_PROD GitHub Actions secret is empty."
            echo "Set it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Create/refresh app secret
        # Contact-form token + all data-room credentials, mirrored 1:1 from
        # GitHub Actions secrets by the shared script (kept in ci/ so this
        # workflow and deploy.yml cannot drift). kubectl-managed (not helm),
        # annotated keep so helm never prunes it.
        env:
          RELATICLE_API_TOKEN: ${{ secrets.RELATICLE_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: ${{ secrets.MAIL_ENCRYPTION }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ secrets.ADMIN_BOOTSTRAP_EMAILS }}
          GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          GOOGLE_CALENDAR_IMPERSONATE: ${{ secrets.GOOGLE_CALENDAR_IMPERSONATE }}
        run: sh ci/create-app-secret.sh

      - name: Helm upgrade
        run: |
          echo "Deploying io2060/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} to namespace 'web'..."
          helm upgrade --install website ./charts \
            --namespace web \
            --create-namespace \
            --set image.tag=${{ env.RELEASE_VERSION }} \
            --set dataroom.migrate.tag=migrate-${{ env.RELEASE_VERSION }} \
            --wait --timeout 5m

      - name: Show deployed resources
        if: always()
        run: |
          helm status website -n web || true
          kubectl -n web get deploy,svc,ingress -l app.kubernetes.io/name=website -o wide || true

  # Announce stable (Release Please) releases on Discord. resolve-version wraps
  # release-please; release-type=stable is the Release Please path. Chained here
  # (not a `release: published` trigger) because the release is created with the
  # default GITHUB_TOKEN, whose events don't cascade into other workflows.
  discord-notify:
    needs: [resolve-version]
    if: needs.resolve-version.outputs.new-release-published == 'true' && needs.resolve-version.outputs.release-type == 'stable'
    uses: 2060-io/organization/.github/workflows/discord-release-notify-call.yml@d199fdc55832f78f90158117a93d227709ca2746 # main
    with:
      tag_name: ${{ needs.resolve-version.outputs.release-version }}
    secrets:
      DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
